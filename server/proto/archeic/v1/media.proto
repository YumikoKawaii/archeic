syntax = "proto3";

package archeic.v1;

import "google/protobuf/timestamp.proto";

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_IMAGE = 1;
  KIND_VIDEO = 2;
}

message Media {
  string id = 1;
  string name = 2;
  Kind kind = 3;
  string content_type = 4;
  int64 size = 5;
  google.protobuf.Timestamp create_time = 6;
}

service MediaService {
  rpc List(MediaServiceListRequest) returns (MediaServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Get(MediaServiceGetRequest) returns (MediaServiceGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Delete(MediaServiceDeleteRequest) returns (MediaServiceDeleteResponse) {}
}

message MediaServiceListRequest {
  Kind kind = 1;
}

message MediaServiceListResponse {
  repeated Media media = 1;
}

message MediaServiceGetRequest {
  string id = 1;
}

message MediaServiceGetResponse {
  Media media = 1;
}

message MediaServiceDeleteRequest {
  string id = 1;
}

message MediaServiceDeleteResponse {}
