server {
    listen 80;
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
