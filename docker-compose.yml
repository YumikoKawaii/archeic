services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: archeic
      MYSQL_USER: archeic
      MYSQL_PASSWORD: archeic
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: archeic
      RUSTFS_SECRET_KEY: archeic-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  migrate:
    build: ./server
    command: ["migrate", "up"]
    environment:
      MYSQL_DSN: archeic:archeic@tcp(mysql:3306)/archeic?parseTime=true
    depends_on:
      - mysql

  server:
    build: ./server
    command: ["server"]
    environment:
      MYSQL_DSN: archeic:archeic@tcp(mysql:3306)/archeic?parseTime=true
      S3_ENDPOINT: rustfs:9000
      S3_ACCESS_KEY: archeic
      S3_SECRET_KEY: archeic-secret
      S3_BUCKET: archeic
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started

  presentation:
    build: ./presentation
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mysql-data:
  rustfs-data:
