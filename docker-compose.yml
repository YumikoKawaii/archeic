services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: archeic
      MYSQL_USER: archeic
      MYSQL_PASSWORD: archeic
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  server:
    build: ./server
    environment:
      MYSQL_DSN: archeic:archeic@tcp(mysql:3306)/archeic?parseTime=true
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: archeic
    depends_on:
      - mysql
      - minio

  presentation:
    build: ./presentation
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mysql-data:
  minio-data:
