x-mysql-dsn: &mysql-dsn ${MYSQL_USER:?set in .env}:${MYSQL_PASSWORD:?set in .env}@tcp(mysql:3306)/${MYSQL_DATABASE:?set in .env}?parseTime=true

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  migrate:
    build: ./server
    command: ["migrate", "up"]
    environment:
      MYSQL_DSN: *mysql-dsn
    depends_on:
      - mysql

  server:
    build: ./server
    command: ["server"]
    environment:
      MYSQL_DSN: *mysql-dsn
      S3_ENDPOINT: rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-archeic}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started

  presentation:
    build: ./presentation
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mysql-data:
  rustfs-data:
